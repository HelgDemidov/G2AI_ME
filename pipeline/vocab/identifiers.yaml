# Справочник цитирования: формальные идентификаторы и алиасы -> корпус
# (spec graph-v2 §3, расширен graph-hardening §2).
#
# Класс `jurisdictions.yaml`: СПРАВОЧНИК БЕЗ ГЕЙТА — `validate_sources` его не проверяет
# и незнакомый идентификатор ничего не роняет. Наполняется по мере встречи цитат:
# `build_graph.py` печатает нерезолвнутые в `sources/.state/cite_leads.yaml`, оттуда
# сюда переезжают те, что реально указывают на документ НАШЕГО корпуса.
#
# Две секции — два РАЗНЫХ канала, не путать:
#   `identifiers` — РЕЗОЛЮЦИЯ: формальный идентификатор -> doc-id корпуса.
#   `aliases`     — ЭКСТРАКЦИЯ: строка в тексте -> формальный идентификатор.
# Алиас сам по себе ребра не строит: он даёт идентификатор, который дальше проходит ту
# же резолюцию (не нашлось записи — обычный лид, а не ребро).

# --- РЕЗОЛЮЦИЯ ---
#
# Зачем нужна помимо авто-резолюции из source_url: URL несёт идентификатор далеко не
# всегда. Живой пример — `eu-ai-act-2024`, у которого source_url в OJ-форме
# (`uri=OJ:L_202401689`): литера типа акта (R/L) из неё не выводится надёжно, поэтому
# эвристика честно пасует, а связь проставляет человек здесь. Обратный пример —
# eurlex-допуски: их URL несёт `?uri=CELEX:...` буквально и резолвится САМ, строка тут
# не нужна.
#
# ⚠ SLCG — идентификатор ВЫПУСКА газеты, а не акта: «Službeni list CG br. 65/20» — это
# номер выпуска, в котором законно опубликованы несколько разных законов. Поэтому
# авто-канала для SLCG нет by construction (URL их не несут), а запись здесь означает
# утверждение человека «в этом выпуске нас интересует именно этот документ».
#
# Запись, чей doc-id отсутствует в реестре, даёт предупреждение и строку отчёта, но НЕ
# роняет сборку графа (справочник без гейта — протухшая строка не должна стоить графа).

identifiers:
  CELEX:32024R1689: eu-ai-act-2024

# --- ЭКСТРАКЦИЯ (алиасы) ---
#
# Матчинг: literal + границы слов, регистронезависимо. НЕ регекс — обобщать нельзя.
# Границы слов дают флексии бесплатно («GDPR-om» в черногорском тексте).
#
# ⚠ ПРАВИЛО ОДНОЗНАЧНОСТИ (precision на кураторе): алиас должен указывать на ОДИН акт
# в любом контексте корпуса. Живая ловушка: голый «AI Act» в `oxford-insights-gairi-2025`
# означает ещё и корейский «Basic AI Act», и тайваньский — такой алиас построил бы
# ложные рёбра, а ложное ребро в юридическом графе дороже пропущенного. Берём различающую
# форму («EU AI Act»), а не короткую.
#
# Границы канала: применяется только к тексту `doc.md`; неограниченный рост списка
# (мультиязычные полные титулы) — сигнал, что задача переросла справочник и её место
# в L2-экстракции (spec graph-v2 §5), а не в обобщении матчинга.

aliases:
  EU AI Act: CELEX:32024R1689
