# Справочник формальных идентификаторов -> doc-id корпуса (spec graph-v2 §3).
#
# Класс `jurisdictions.yaml`: СПРАВОЧНИК БЕЗ ГЕЙТА — `validate_sources` его не проверяет
# и незнакомый идентификатор ничего не роняет. Наполняется по мере встречи цитат:
# `build_graph.py` печатает нерезолвнутые в `sources/.state/cite_leads.yaml`, оттуда
# сюда переезжают те, что реально указывают на документ НАШЕГО корпуса.
#
# Зачем нужен помимо авто-резолюции из source_url: URL несёт идентификатор далеко не
# всегда. Живой пример — `eu-ai-act-2024`, у которого source_url в OJ-форме
# (`uri=OJ:L_202401689`): литера типа акта (R/L) из неё не выводится надёжно, поэтому
# эвристика честно пасует, а связь проставляет человек здесь.
#
# Запись, чей doc-id отсутствует в реестре, даёт предупреждение и строку отчёта, но НЕ
# роняет сборку графа (справочник без гейта — протухшая строка не должна стоить графа).

identifiers: {}
  # Пример (раскомментировать при первом реальном случае):
  # CELEX:32024R1689: eu-ai-act-2024
